let sortKey='asin',sortAsc=true;
function render(){
const cat=document.getElementById('filterCategory').value;

let f=ALL_PRODUCTS.filter(p=>{if(cat&&p.category!==cat)return false;if(q&&!p.asin.toLowerCase().includes(q)&&!(p.product_name||'').toLowerCase().includes(q))return false;return true});

const wp=ALL_PRODUCTS.filter(p=>p.lowest_price),ws=ALL_PRODUCTS.filter(p=>p.seller);
const cats=[...new Set(ALL_PRODUCTS.map(p=>p.category).filter(Boolean))];
const today=ALL_PRODUCTS[0]?ALL_PRODUCTS[0].last_updated:'';
document.getElementById('subtitle').textContent=ALL_PRODUCTS.length+' products tracked | Amazon.ae | Updated: '+today;
document.getElementById('kpis').innerHTML='<div class="kpi"><div class="label">Total Products</div><div class="value">'+ALL_PRODUCTS.length+'</div><div class="sub">ASINs tracked</div></div><div class="kpi"><div class="label">With Price</div><div class="value">'+wp.length+'<span class="unit">/ '+ALL_PRODUCTS.length+'</span></div><div class="sub">'+(ALL_PRODUCTS.length-wp.length)+' awaiting data</div></div><div class="kpi"><div class="label">With Seller</div><div class="value">'+ws.length+'</div><div class="sub">seller info captured</div></div>';
const sel=document.getElementById('filterCategory'),cur=sel.value;
sel.innerHTML='<option value="">All Categories</option>'+cats.map(c=>'<option value="'+c+'" '+(c===cur?'selected':'')+'>'+c+'</option>').join('');
document.getElementById('tbody').innerHTML=f.map(p=>'<tr><td><a class="asin-link" href="'+p.product_url+'" target="_blank">'+p.asin+'</a></td><td>'+(p.product_name?'<span class="badge xiaomi">Xiaomi</span> '+p.product_name:'<span class="no-data">'+p.asin+'</span>')+'</td><td>'+(p.category||'<span class="no-data">-</span>')+'</td><td>'+(p.lowest_price?'<span class="price">AED '+p.lowest_price.toFixed(2)+'</span>':'<span class="no-data">-</span>')+'</td><td class="seller" title="'+(p.seller||'')+'">'+(p.seller||'<span class="no-data">-</span>')+'</td><td>'+(p.rating?'<span class="rating">'+p.rating.toFixed(1)+' / 5</span>':'<span class="no-data">-</span>')+'</td><td>'+(p.review_count?p.review_count.toLocaleString():'<span class="no-data">-</span>')+'</td><td>'+(p.last_updated||'<span class="no-data">-</span>')+'</td></tr>').join('');

}
function sortTable(k){if(sortKey===k)sortAsc=!sortAsc;else{sortKey=k;sortAsc=true}render()}
function exportCSV(){var h=['ASIN','Product','Category','Price','Seller','Rating','Reviews','URL','Updated'];var r=ALL_PRODUCTS.map(function(p){return[p.asin,p.product_name||'',p.category||'',p.lowest_price||'',p.seller||'',p.rating||'',p.review_count||'',p.product_url,p.last_updated||'']});var csv=[h].concat(r).map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');var b=new Blob([csv],{type:'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='xiaomi-tracker-'+new Date().toISOString().slice(0,10)+'.csv';a.click()}

render();
